name: Update icon preview

on:
  push:
    branches: [main developer]
    # only re-run when icons or the generator change (this also prevents loops)
    paths:
      - 'svg/**'
      - 'docs/generate_preview.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate preview
        run: python docs/generate_preview.py svg docs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/icon*
          if git diff --cached --quiet; then
            echo "Preview is up to date."
          else
            git commit -m "chore: update icon preview [skip ci]"
            git push
          fi
