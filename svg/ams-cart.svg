<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="161.60px" height="169.80px" viewBox="0.200 2.150 40.400 42.450">
<title>AMS on rack cart (HR-ToF-AMS type)</title>
<desc>Aerosol mass spectrometer in the style of an Aerodyne HR-ToF-AMS on its rolling cart, after T. Sipkens' AMS icon: open stainless frame; top bay with the aerodynamic-lens inlet and valve, the particle-sizing chamber with chopper, three turbomolecular pumps hanging below it, the vaporiser and ioniser block and the time-of-flight mass spectrometer on top; lower bay with power supplies, data-acquisition computer, turbo controllers and the roughing pump</desc>
