<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="161.60px" height="169.80px" viewBox="0.200 2.150 40.400 42.450">
<title>FTIR on rack cart (Bruker type)</title>
<desc>FTIR multi-gas analyser installed on a rolling instrument cart, as the lab Bruker system: dark powder-coated frame with slate-blue corner blocks; top bay with the slate-blue spectrometer and its grey heated gas cell, the orange heated sample line entering the cell from the left; lower bay with the heated-line temperature controller, the heated filter module with its display and rotameter, the rack computer and the sample pump. Shares the cart outline of the AMS but differs in frame colour, the slate-blue spectrometer and the heated line</desc>
